<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-labelledby="mnTitle mnDesc" fill="none">
  <title id="mnTitle">Meeting note cards</title>
  <desc id="mnDesc">Four stacked note cards, the front one open with lines of writing and a brand-teal heading, representing the standing meetings captured in each day's work log.</desc>
  <!-- back stack -->
  <rect x="52" y="34" width="216" height="60" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <rect x="70" y="52" width="58" height="9" rx="4.5" fill="#0D9488" opacity=".30"/>
  <rect x="70" y="70" width="150" height="7" rx="3.5" fill="#EDF0F4"/>

  <rect x="52" y="106" width="216" height="60" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <rect x="70" y="124" width="72" height="9" rx="4.5" fill="#0D9488" opacity=".30"/>
  <rect x="70" y="142" width="126" height="7" rx="3.5" fill="#EDF0F4"/>

  <rect x="52" y="178" width="216" height="60" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <rect x="70" y="196" width="64" height="9" rx="4.5" fill="#0D9488" opacity=".30"/>
  <rect x="70" y="214" width="160" height="7" rx="3.5" fill="#EDF0F4"/>

  <!-- front card, active -->
  <rect x="36" y="238" width="248" height="66" rx="13" fill="#F4FCFA" stroke="#0D9488" stroke-width="2.5"/>
  <rect x="56" y="256" width="86" height="10" rx="5" fill="#0D9488"/>
  <rect x="56" y="274" width="196" height="7" rx="3.5" fill="#0F172A" opacity=".16"/>
  <rect x="56" y="287" width="132" height="7" rx="3.5" fill="#0F172A" opacity=".10"/>
  <!-- caret -->
  <rect x="252" y="254" width="2.5" height="14" rx="1.25" fill="#0D9488"/>
</svg>
